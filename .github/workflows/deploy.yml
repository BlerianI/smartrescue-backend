name: Build & Deploy

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            set -e

            APP_DIR=/opt/smartrescue_backend
            # Repository-Name in Kleinschreibung für Docker-Tag
            IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest

            mkdir -p $APP_DIR
            cd $APP_DIR

            # ---- .env erstellen mit allen Variablen ----
            cat > .env << 'EOF'
            NODE_ENV=${{ secrets.NODE_ENV || 'production' }}
            PORT=${{ secrets.PORT || '3000' }}
            FRONTEND_URL=https://sm-api.dev
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=https://api.sm-api.dev/api/v1/auth/google/callback
            DO_SPACE_ENDPOINT=${{ secrets.DO_SPACE_ENDPOINT }}
            DO_SPACE_REGION=${{ secrets.DO_SPACE_REGION }}
            DO_SPACE_ACCESS_KEY_ID=${{ secrets.DO_SPACE_ACCESS_KEY_ID }}
            DO_SPACE_SECRET_ACCESS_KEY=${{ secrets.DO_SPACE_SECRET_ACCESS_KEY }}
            DO_SPACE_ACCESS_KEY_NAME=${{ secrets.DO_SPACE_ACCESS_KEY_NAME }}
            EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}
            EOF

            # GHCR login
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker pull $IMAGE

            # alten container ersetzen
            docker stop smartrescue_backend || true
            docker rm smartrescue_backend || true

            docker run -d \
              --name smartrescue_backend \
              --restart unless-stopped \
              --env-file .env \
              -p 3000:3000 \
              $IMAGE
